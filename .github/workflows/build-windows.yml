name: Build Windows package

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q -p no:cacheprovider
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python tools/build_exe.py
      - name: Smoke test - the exe starts and stays up
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\TheIsleCompanion\TheIsleCompanion.exe -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited) { Write-Error "exe exited early with code $($p.ExitCode)"; exit 1 }
          Stop-Process -Id $p.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: TheIsleCompanion-windows
          path: dist/TheIsleCompanion-*-windows.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TheIsleCompanion-*-windows.zip
